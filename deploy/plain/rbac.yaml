---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: update-operator-controller-manager
  namespace: update-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: update-operator-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  - pods/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - updatemanager.onesi.de
  resources:
  - clusterupdates
  - nodeupdates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - updatemanager.onesi.de
  resources:
  - clusterupdates/finalizers
  - nodeupdates/finalizers
  verbs:
  - update
- apiGroups:
  - updatemanager.onesi.de
  resources:
  - clusterupdates/status
  - nodeupdates/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: update-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: update-operator-manager-role
subjects:
- kind: ServiceAccount
  name: update-operator-controller-manager
  namespace: update-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: update-operator-leader-election-role
  namespace: update-operator-system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: update-operator-leader-election-rolebinding
  namespace: update-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: update-operator-leader-election-role
subjects:
- kind: ServiceAccount
  name: update-operator-controller-manager
  namespace: update-operator-system
