name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -v

  manifests:
    name: Regenerate manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the head ref so we can push back to the PR branch
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate CRDs and DeepCopy code
        run: make manifests generate

      - name: Commit regenerated files if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add config/crd/bases/ config/rbac/ api/v1alpha1/zz_generated.deepcopy.go
            git commit -m "chore: regenerate manifests and deepcopy code [skip ci]"
            git push
          else
            echo "Generated files are already up to date."
          fi
