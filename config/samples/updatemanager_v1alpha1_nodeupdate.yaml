apiVersion: updatemanager.onesi.de/v1alpha1
kind: NodeUpdate
metadata:
  labels:
    app.kubernetes.io/name: nodeupdate
    app.kubernetes.io/instance: nodeupdate-sample
    app.kubernetes.io/part-of: updatecontroller
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: updatecontroller
  name: nodeupdate-sample
spec:
  # OS-specific patch image that ships local apt repository lists.
  # The image copies repo lists to the host and runs apt upgrade via nsenter.
  image: "ghcr.io/dusthoff/update-operator/ubuntu-22-04-patch:latest"
  # Lower number = updated first when multiple nodes share a cycle.
  priority: 1
  packages:
    # Packages to explicitly install or upgrade (leave empty for full dist-upgrade).
    install: []
    # Packages that must NOT be upgraded (e.g. Kubernetes components).
    hold:
      - kubeadm
      - kubectl
      - kubelet
      - kubernetes-cni
