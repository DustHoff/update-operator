apiVersion: updatemanager.onesi.de/v1alpha1
kind: ClusterUpdate
metadata:
  labels:
    app.kubernetes.io/name: clusterupdate
    app.kubernetes.io/instance: clusterupdate-sample
    app.kubernetes.io/part-of: updatecontroller
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: updatecontroller
  name: clusterupdate-sample
spec:
  update:
    disabled: false
    # Cron expression: every Sunday at 02:00
    schedule: "0 2 * * 0"
    # How many nodes may be updated simultaneously.
    # Default (0 or omitted) is treated as 1 – strictly sequential.
    maxUnavailableNode: 1
